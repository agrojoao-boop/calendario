<!DOCTYPE html>
<html>
<body style="background:black; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">

<div style="position:relative; width:500px; height:500px;">

  <video id="player" width="500" height="500" style="object-fit:cover;" controls></video>

  <button onclick="anterior()" style="position:absolute; left:-30px; top:50%; transform:translateY(-50%); background:none; border:none; color:white; font-size:20px; cursor:pointer; opacity:0.4;">&#9664;</button>

  <button onclick="proximo()" style="position:absolute; right:-30px; top:50%; transform:translateY(-50%); background:none; border:none; color:white; font-size:20px; cursor:pointer; opacity:0.4;">&#9654;</button>

</div>

<script>
const videos = [
  "Gravação de Tela 2025-10-25 125909.mp4",
  "Gravação de Tela 2025-10-25 131647.mp4",
  "Gravação de Tela 2025-10-25 160811.mp4",
  "Gravação de Tela 2025-10-25 161728.mp4",
  "Gravação de Tela 2025-10-25 172943.mp4",
  "Gravação de Tela 2025-10-25 184028.mp4"
];

let current = 0;
const player = document.getElementById("player");

function carregar(index) {
  player.src = videos[index];
  player.load();
}

function proximo() {
  if (current < videos.length - 1) {
    current++;
    carregar(current);
  }
}

function anterior() {
  if (current > 0) {
    current--;
    carregar(current);
  }
}

player.addEventListener("ended", proximo);
carregar(0);
</script>
</body>
</html>
