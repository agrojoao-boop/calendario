<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:black; display:flex; justify-content:center; align-items:center; width:100%; height:100%; overflow:hidden; }
  .container { position:relative; width:100%; height:100%; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .btn { position:absolute; top:50%; transform:translateY(-50%); background:none; border:none; color:white; font-size:24px; cursor:pointer; opacity:0.5; z-index:10; }
  .btn-left { left:10px; }
  .btn-right { right:10px; }
</style>
</head>
<body>
<div class="container">
  <video id="player" autoplay muted loop playsinline onclick="togglePlay()"></video>
  <button class="btn btn-left" onclick="anterior()">&#9664;</button>
  <button class="btn btn-right" onclick="proximo()">&#9654;</button>
</div>
<script>
const videos = [
  "Gravação de Tela 2025-10-25 125909.mp4",
  "Gravação de Tela 2025-10-25 131647.mp4",
  "Gravação de Tela 2025-10-25 160811.mp4",
  "Gravação de Tela 2025-10-25 161728.mp4",
  "Gravação de Tela 2025-10-25 172943.mp4",
  "Gravação de Tela 2025-10-25 184028.mp4"
];
let current = 0;
const player = document.getElementById("player");

function carregar(index) {
  player.src = videos[index];
  player.load();
  player.play();
}

function togglePlay() {
  player.paused ? player.play() : player.pause();
}

function proximo() {
  current = (current + 1) % videos.length;
  carregar(current);
}

function anterior() {
  current = (current - 1 + videos.length) % videos.length;
  carregar(current);
}

player.addEventListener("ended", proximo);
carregar(0);
</script>
</body>
</html>
