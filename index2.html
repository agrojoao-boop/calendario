<style>
  *{box-sizing:border-box;margin:0;padding:0}

  .wrap{
    max-width:480px;
    margin:2rem auto;
    padding:2rem 1.75rem;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    border:1px solid #222;
    border-radius:0;
    background:#fff;
  }

  .brand{display:flex;flex-direction:column;gap:2px;margin-bottom:1.75rem;padding-bottom:1.25rem;border-bottom:1px solid #e8e8e8}
  .brand-name{font-size:14px;font-weight:600;color:#111;letter-spacing:0.01em}
  .brand-sub{font-size:11px;color:#888;letter-spacing:0.01em}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:#1a7a56;background:#edfaf4;border:1px solid #b2e8d0;border-radius:0;padding:3px 10px;margin-bottom:1.5rem;letter-spacing:0.02em}
  .badge-dot{width:5px;height:5px;border-radius:50%;background:#1D9E75;flex-shrink:0}

  h2{font-size:20px;font-weight:600;color:#111;margin-bottom:6px;letter-spacing:-0.01em}
  .subtitle{font-size:13px;color:#666;margin-bottom:1.75rem;line-height:1.65}

  .card{background:#fafafa;border:1px solid #e8e8e8;border-radius:0;padding:1.25rem 1.25rem 1rem;margin-bottom:1rem}

  .form-row{margin-bottom:14px}
  .form-label{font-size:10px;color:#888;margin-bottom:5px;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .form-input{width:100%;padding:9px 11px;border:1px solid #ccc;border-radius:0;font-size:13.5px;color:#111;background:#fff;outline:none;font-family:inherit;transition:border-color .15s}
  .form-input:focus{border-color:#111;box-shadow:none}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .btn-submit{width:100%;padding:11px;background:#111;color:#fff;border:none;border-radius:0;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .15s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:0.02em}
  .btn-submit:hover{background:#333}
  .btn-submit:disabled{opacity:.5;cursor:default}

  .notice{display:flex;align-items:flex-start;gap:10px;background:#f5f5f5;border-radius:0;padding:11px 13px;margin-top:12px;font-size:12px;color:#888;line-height:1.6}

  .success-card{display:none;background:#edfaf4;border:1px solid #b2e8d0;border-radius:0;padding:1.5rem;text-align:center;margin-top:1rem}
  .success-card p{font-size:13.5px;color:#1a7a56;line-height:1.65}

  .err-msg{display:none;padding:9px 13px;font-size:12.5px;border-radius:0;margin-top:10px;border:1px solid #f5c0c0;background:#fff5f5;color:#c0392b}
  .err-msg.visible{display:block}

  .lang-bar{display:flex;justify-content:flex-end;margin-bottom:1.25rem;gap:6px}
  .lang-btn{padding:3px 10px;font-size:11px;font-weight:500;border:1px solid #ccc;border-radius:0;background:#fff;color:#888;cursor:pointer;font-family:inherit;transition:all .15s;letter-spacing:0.03em}
  .lang-btn.active{background:#111;color:#fff;border-color:#111}

  .btn-geo{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border:1px solid #ccc;border-radius:0;background:#fff;color:#555;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;letter-spacing:0.02em}
  .btn-geo:hover{background:#111;color:#fff;border-color:#111}
  .btn-geo:disabled{opacity:.4;cursor:default}

  @media(max-width:480px){
    .row2{grid-template-columns:1fr}
    .wrap{margin:0;padding:1.25rem 1rem;border-left:none;border-right:none;border-top:none}
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<div class="wrap">
  <div class="lang-bar">
    <button class="lang-btn" id="btn-pt" onclick="setLang('pt')">&#127463;&#127479; PT</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">&#127482;&#127480; EN</button>
  </div>

  <!-- Back to site -->
  <div style="margin-bottom:1.25rem;">
    <a href="https://cultivoornamental.com/" onclick="window.location.href='https://cultivoornamental.com/';return false;" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#888;text-decoration:none;border:1px solid #e0e0e0;padding:5px 12px;transition:all .15s;" onmouseover="this.style.color='#111';this.style.borderColor='#111';" onmouseout="this.style.color='#888';this.style.borderColor='#e0e0e0';">
      &#8592; Back to site
    </a>
  </div>

  <div class="brand">
    <div class="brand-name">Cultivo Ornamental</div>
    <div class="brand-sub">cultivoornamental.com</div>
  </div>

  <div class="badge">
    <span class="badge-dot"></span>
    <span id="t-badge"></span>
  </div>

  <h2 id="t-title"></h2>
  <p class="subtitle" id="t-subtitle"></p>

  <div class="card" id="formCard">
    <div class="form-row">
      <label class="form-label" id="t-lnome" for="nome"></label>
      <input class="form-input" id="nome" type="text" />
    </div>
    <div class="form-row">
      <label class="form-label" id="t-lemail" for="email"></label>
      <input class="form-input" id="email" type="email" />
    </div>
    <div class="form-row" style="margin-bottom:6px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
        <label class="form-label" style="margin-bottom:0;" id="t-lloc"></label>
        <button class="btn-geo" id="btn-geo" onclick="detectarLocalizacao()" title="">
          <span id="geo-icon">&#128205;</span>
          <span id="t-geo"></span>
        </button>
      </div>
      <div class="row2">
        <div class="form-row" style="margin-bottom:0;">
          <label class="form-label" id="t-lcidade" for="cidade"></label>
          <input class="form-input" id="cidade" type="text" />
        </div>
        <div class="form-row" style="margin-bottom:0;">
          <label class="form-label" id="t-lestado" for="estado"></label>
          <input class="form-input" id="estado" type="text" />
        </div>
      </div>
    </div>
    <div class="form-row">
      <label class="form-label" id="t-lpais" for="pais"></label>
      <input class="form-input" id="pais" type="text" />
    </div>

    <div class="err-msg" id="errMsg"></div>

    <button class="btn-submit" id="btn-submit" onclick="submeter()">
      <span>&#8594;</span>
      <span id="t-btn"></span>
    </button>

    <div class="notice">
      <span style="font-size:15px;margin-top:1px;flex-shrink:0">&#9203;</span>
      <span id="t-notice"></span>
    </div>
  </div>

  <div class="success-card" id="successCard">
    <span style="font-size:32px;display:block;margin-bottom:12px">&#9989;</span>
    <p id="t-successMsg"></p>
  </div>
</div>

<script>
const i18n = {
  pt: {
    badge:        'Assinatura concluída',
    title:        'Submeter informações',
    subtitle:     'Envie as informações básicas para receber o seu calendário. O processo pode demandar até 24 horas após a confirmação do pagamento.',
    lnome:        'Nome ou apelido',
    pnome:        'Como quer ser chamado',
    lemail:       'E-mail da conta Google',
    pemail:       'Gmail, Outlook, Yahoo, ou outro',
    lloc:         'Localização',
    geo:          'Detectar localização',
    geoDetecting: 'Detectando...',
    geoErr:       'Não foi possível detectar. Preencha manualmente.',
    lcidade:      'Cidade',
    pcidade:      'Ex: Campinas',
    lestado:      'Estado',
    pestado:      'Ex: SP',
    lpais:        'País',
    ppais:        'Ex: Brasil',
    btn:          'Submeter informações',
    notice:       'Suas informações serão enviadas automaticamente ao clicar.',
    errNome:      'Informe seu nome ou apelido.',
    errEmail:     'Informe o e-mail da sua conta Google.',
    errCidade:    'Informe sua cidade.',
    errPais:      'Informe o país.',
    errSend:      'Erro ao enviar. Tente novamente.',
    successMsg:   function(nome, local){ return 'Informações recebidas, ' + nome + '! Nas próximas 24 horas você receberá um convite para o seu calendário de ' + local + ' diretamente na sua Google Agenda. Caso não receba, entre em contato pelo e-mail calendario.cultivoornamental@gmail.com para realizarmos o compartilhamento manual.'; }
  },
  en: {
    badge:        'Subscription complete',
    title:        'Submit your information',
    subtitle:     'Send your basic information to receive your calendar. The process may take up to 24 hours after payment confirmation.',
    lnome:        'Name or nickname',
    pnome:        'What should we call you',
    lemail:       'Google account email',
    pemail:       'Gmail, Outlook, Yahoo, or other',
    lloc:         'Location',
    geo:          'Detect location',
    geoDetecting: 'Detecting...',
    geoErr:       'Could not detect. Please fill in manually.',
    lcidade:      'City',
    pcidade:      'E.g. New York',
    lestado:      'State / Province',
    pestado:      'E.g. NY',
    lpais:        'Country',
    ppais:        'E.g. United States',
    btn:          'Submit information',
    notice:       'Your information will be sent automatically when you click.',
    errNome:      'Please enter your name or nickname.',
    errEmail:     'Please enter your Google account email.',
    errCidade:    'Please enter your city.',
    errPais:      'Please enter your country.',
    errSend:      'Error sending. Please try again.',
    successMsg:   function(nome, local){ return 'Done, ' + nome + '! Within 24 hours you will receive an invitation to your ' + local + ' calendar directly in your Google Calendar. If you do not receive it, contact us at calendario.cultivoornamental@gmail.com for manual sharing.'; }
  }
};

var lang = 'pt';

function detectLang(){
  var nav = (navigator.language || navigator.userLanguage || 'pt').toLowerCase();
  return nav.startsWith('pt') ? 'pt' : 'en';
}

function setLang(l){
  lang = l;
  document.getElementById('btn-pt').className = 'lang-btn' + (l === 'pt' ? ' active' : '');
  document.getElementById('btn-en').className = 'lang-btn' + (l === 'en' ? ' active' : '');
  var t = i18n[l];
  document.getElementById('t-badge').textContent    = t.badge;
  document.getElementById('t-title').textContent    = t.title;
  document.getElementById('t-subtitle').textContent = t.subtitle;
  document.getElementById('t-lnome').textContent    = t.lnome;
  document.getElementById('nome').placeholder       = t.pnome;
  document.getElementById('t-lemail').textContent   = t.lemail;
  document.getElementById('email').placeholder      = t.pemail;
  document.getElementById('t-lloc').textContent     = t.lloc;
  document.getElementById('t-geo').textContent      = t.geo;
  document.getElementById('btn-geo').title          = t.geo;
  document.getElementById('t-lcidade').textContent  = t.lcidade;
  document.getElementById('cidade').placeholder     = t.pcidade;
  document.getElementById('t-lestado').textContent  = t.lestado;
  document.getElementById('estado').placeholder     = t.pestado;
  document.getElementById('t-lpais').textContent    = t.lpais;
  document.getElementById('pais').placeholder       = t.ppais;
  document.getElementById('t-btn').textContent      = t.btn;
  document.getElementById('t-notice').textContent   = t.notice;
  document.getElementById('errMsg').className       = 'err-msg';
}

function showErr(txt){
  var el = document.getElementById('errMsg');
  el.textContent = txt;
  el.className = 'err-msg visible';
}

function submeter(){
  var t      = i18n[lang];
  var nome   = document.getElementById('nome').value.trim();
  var email  = document.getElementById('email').value.trim();
  var cidade = document.getElementById('cidade').value.trim();
  var estado = document.getElementById('estado').value.trim();
  var pais   = document.getElementById('pais').value.trim();

  if(!nome)                                                   { showErr(t.errNome);   return; }
  if(!email || !email.includes('@') || !email.includes('.'))   { showErr(t.errEmail);  return; }
  if(!cidade)                                                 { showErr(t.errCidade); return; }
  if(!pais)                                                   { showErr(t.errPais);   return; }

  document.getElementById('errMsg').className = 'err-msg';
  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.style.opacity = '0.6';

  fetch('https://formspree.io/f/meenlrbw', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({ nome: nome, email: email, cidade: cidade, estado: estado || '-', pais: pais, idioma: lang })
  }).then(function(res){
    if(res.ok){
      var local = [cidade, estado, pais].filter(Boolean).join(', ');
      document.getElementById('t-successMsg').textContent  = t.successMsg(nome, local);
      document.getElementById('formCard').style.display    = 'none';
      document.getElementById('successCard').style.display = 'block';
    } else {
      showErr(t.errSend);
      btn.disabled = false;
      btn.style.opacity = '1';
    }
  }).catch(function(){
    showErr(t.errSend);
    btn.disabled = false;
    btn.style.opacity = '1';
  });
}

function detectarLocalizacao(){
  var t    = i18n[lang];
  var btn  = document.getElementById('btn-geo');
  var icon = document.getElementById('geo-icon');
  var geo  = document.getElementById('t-geo');
  btn.disabled     = true;
  icon.textContent = '\u23F3';
  geo.textContent  = t.geoDetecting;

  if(!navigator.geolocation){ showErr(t.geoErr); resetGeoBtn(); return; }

  navigator.geolocation.getCurrentPosition(
    function(pos){
      fetch('https://nominatim.openstreetmap.org/reverse?lat=' + pos.coords.latitude + '&lon=' + pos.coords.longitude + '&format=json&accept-language=' + lang)
        .then(function(r){ return r.json(); })
        .then(function(data){
          var addr   = data.address || {};
          var cidade = addr.city || addr.town || addr.village || addr.municipality || '';
          var estado = addr.state || addr.region || '';
          var pais   = addr.country || '';
          if(cidade) document.getElementById('cidade').value = cidade;
          if(estado) document.getElementById('estado').value = estado;
          if(pais)   document.getElementById('pais').value   = pais;
          icon.textContent = '\u2705';
          geo.textContent  = t.geo;
          btn.disabled     = false;
        }).catch(function(){ showErr(t.geoErr); resetGeoBtn(); });
    },
    function(){ showErr(t.geoErr); resetGeoBtn(); },
    { timeout: 8000 }
  );
}

function resetGeoBtn(){
  var t = i18n[lang];
  document.getElementById('geo-icon').textContent = '\uD83D\uDCCD';
  document.getElementById('t-geo').textContent    = t.geo;
  document.getElementById('btn-geo').disabled     = false;
}

setLang(detectLang());
</script>
