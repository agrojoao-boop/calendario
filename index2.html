<style>
  *{box-sizing:border-box;margin:0;padding:0}
  .wrap{max-width:520px;margin:2rem auto;padding:1.5rem 1.25rem;font-family:var(--font-sans);border:1px solid #d0d0d8;border-radius:12px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.07)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;padding-bottom:1.25rem;border-bottom:0.5px solid var(--color-border-tertiary)}
  .brand-name{font-size:15px;font-weight:500;color:var(--color-text-primary)}
  .brand-sub{font-size:12px;color:var(--color-text-secondary)}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-success);background:var(--color-background-success);border:0.5px solid var(--color-border-success);border-radius:20px;padding:4px 12px;margin-bottom:1.25rem}
  .badge-dot{width:6px;height:6px;border-radius:50%;background:#1D9E75;flex-shrink:0}
  .badge-en{font-weight:500}
  .badge-pt{opacity:.7;font-size:11px}
  h2{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px}
  .subtitle{font-size:14px;color:var(--color-text-secondary);margin-bottom:1.5rem;line-height:1.6}
  .card{background:#f8f8fb;border:1px solid #e4e4ec;border-radius:10px;padding:1.25rem;margin-bottom:1rem}
  .form-row{margin-bottom:12px}
  .form-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:5px;display:block;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  .form-input,.form-select{width:100%;padding:9px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:14px;color:var(--color-text-primary);background:var(--color-background-primary);outline:none;font-family:var(--font-sans);transition:box-shadow .15s}
  .form-input:focus,.form-select:focus{box-shadow:0 0 0 2px rgba(24,95,165,0.25)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn-submit{width:100%;padding:11px;background:#185FA5;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:14px;font-weight:500;cursor:pointer;transition:opacity .15s;font-family:var(--font-sans);display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-submit:hover{opacity:.88}
  .notice{display:flex;align-items:flex-start;gap:10px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px 14px;margin-top:12px;font-size:13px;color:var(--color-text-secondary);line-height:1.6}
  .notice i{color:#185FA5;margin-top:1px;flex-shrink:0;font-size:16px}
  .success-card{display:none;background:var(--color-background-success);border:0.5px solid var(--color-border-success);border-radius:var(--border-radius-lg);padding:1.5rem;text-align:center;margin-top:1rem}
  .success-card i{font-size:32px;color:#1D9E75;margin-bottom:8px;display:block}
  .success-card p{font-size:14px;color:var(--color-text-success);line-height:1.6}
  .err-msg{display:none;padding:10px 14px;font-size:13px;border-radius:var(--border-radius-md);margin-top:10px;border:0.5px solid var(--color-border-danger);background:var(--color-background-danger);color:var(--color-text-danger)}
  .err-msg.visible{display:block}
  .lang-bar{display:flex;justify-content:flex-end;margin-bottom:1rem;gap:6px}
  .lang-btn{padding:4px 10px;font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:20px;background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;font-family:var(--font-sans);transition:all .15s}
  .lang-btn.active{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
  @media(max-width:480px){.row2{grid-template-columns:1fr}.wrap{padding:1rem 0.75rem}}
  .btn-geo{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:4px 10px;border:1px solid #185FA5;border-radius:20px;background:transparent;color:#185FA5;cursor:pointer;font-family:var(--font-sans);transition:all .15s;white-space:nowrap;}
  .btn-geo:hover{background:#185FA5;color:#fff;}
  .btn-geo:disabled{opacity:.5;cursor:default;}
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

<div class="wrap">
  <div class="lang-bar">
    <button class="lang-btn" id="btn-pt" onclick="setLang('pt')">🇧🇷 PT</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">🇺🇸 EN</button>
  </div>

  <div class="brand">
    <div>
      <div class="brand-name">Cultivo Ornamental</div>
      <div class="brand-sub">cultivoornamental.com.br</div>
    </div>
  </div>

  <div class="badge">
    <span class="badge-dot"></span>
    <span id="t-badge"></span>
  </div>

  <h2 id="t-title"></h2>
  <p class="subtitle" id="t-subtitle"></p>

  <div class="card" id="formCard">
    <div class="form-row">
      <label class="form-label" id="t-lnome" for="nome"></label>
      <input class="form-input" id="nome" type="text" />
    </div>
    <div class="form-row" style="margin-bottom:6px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
        <label class="form-label" style="margin-bottom:0;" id="t-lloc"></label>
        <button class="btn-geo" id="btn-geo" onclick="detectarLocalizacao()" title="">
          <span id="geo-icon">📍</span>
          <span id="t-geo"></span>
        </button>
      </div>
      <div class="row2">
        <div class="form-row" style="margin-bottom:0;">
          <label class="form-label" id="t-lcidade" for="cidade"></label>
          <input class="form-input" id="cidade" type="text" />
        </div>
        <div class="form-row" style="margin-bottom:0;">
          <label class="form-label" id="t-lestado" for="estado"></label>
          <input class="form-input" id="estado" type="text" />
        </div>
      </div>
    </div>
    <div class="form-row">
      <label class="form-label" id="t-lpais" for="pais"></label>
      <input class="form-input" id="pais" type="text" />
    </div>

    <div class="err-msg" id="errMsg"></div>

    <button class="btn-submit" onclick="submeter()">
      <span aria-hidden="true">→</span>
      <span id="t-btn"></span>
    </button>

    <div class="notice">
      <span aria-hidden="true" style="font-size:15px;margin-top:1px;flex-shrink:0">⏱</span>
      <span id="t-notice"></span>
    </div>
  </div>

  <div class="success-card" id="successCard">
    <span aria-hidden="true" style="font-size:32px;display:block;margin-bottom:8px">✅</span>
    <p id="t-successMsg"></p>
  </div>
</div>

<script>
const DEST = 'calendario.cultivoornamental@gmail.com';

const i18n = {
  pt: {
    badge: 'Assinatura concluída',
    title: 'Submeter informações',
    subtitle: 'Envie as informações básicas para receber o seu calendário. O processo pode demandar um período de 24 horas após confirmação do pagamento.',
    lnome: 'Nome ou apelido', pnome: 'Como quer ser chamado',
    lloc: 'Localização', geo: 'Detectar localização', geoDetecting: 'Detectando...', geoErr: 'Não foi possível detectar. Preencha manualmente.',
    lcidade: 'Cidade', pcidade: 'Ex: Campinas',
    lestado: 'Estado', pestado: 'Ex: SP',
    lpais: 'País', ppais: 'Selecione o país',
    btn: 'Submeter informações',
    notice: 'Ao clicar, seu aplicativo de e-mail será aberto com as informações preenchidas, prontas para envio.',
    errNome: 'Informe seu nome ou apelido.',
    errCidade: 'Informe sua cidade.',
    errPais: 'Selecione o país.',
    successMsg: (nome, local) => `E-mail preparado para ${nome}! Verifique seu aplicativo de e-mail, confirme os dados e envie. Seu calendário de ${local} será enviado em até 24 horas após a confirmação do pagamento.`,
    subject: (nome) => `Informações para calendário — ${nome}`,
    body: (nome, cidade, estado, pais) => `Olá!\n\nSegue minhas informações para geração do calendário:\n\nNome ou apelido: ${nome}\nCidade: ${cidade}\nEstado: ${estado}\nPaís: ${pais}\n\nAguardo o calendário. Obrigado!`
  },
  en: {
    badge: 'Subscription complete',
    title: 'Submit your information',
    subtitle: 'Send your basic information to receive your calendar. The process may take up to 24 hours after payment confirmation.',
    lnome: 'Name or nickname', pnome: 'What should we call you',
    lloc: 'Location', geo: 'Detect location', geoDetecting: 'Detecting...', geoErr: 'Could not detect. Please fill in manually.',
    lcidade: 'City', pcidade: 'E.g. New York',
    lestado: 'State / Province', pestado: 'E.g. NY',
    lpais: 'Country', ppais: 'Select a country',
    btn: 'Submit information',
    notice: 'Clicking will open your email app with the information pre-filled, ready to send.',
    errNome: 'Please enter your name or nickname.',
    errCidade: 'Please enter your city.',
    errPais: 'Please select a country.',
    successMsg: (nome, local) => `Email prepared for ${nome}! Check your email app, confirm the details and send. Your ${local} calendar will be delivered within 24 hours of payment confirmation.`,
    subject: (nome) => `Calendar information — ${nome}`,
    body: (nome, cidade, estado, pais) => `Hello!\n\nHere is my information for the calendar:\n\nName or nickname: ${nome}\nCity: ${cidade}\nState / Province: ${estado}\nCountry: ${pais}\n\nLooking forward to receiving the calendar. Thank you!`
  }
};

let lang = 'pt';

function detectLang(){
  const nav = (navigator.language || navigator.userLanguage || 'pt').toLowerCase();
  return nav.startsWith('pt') ? 'pt' : 'en';
}

function setLang(l){
  lang = l;
  document.getElementById('btn-pt').className = 'lang-btn'+(l==='pt'?' active':'');
  document.getElementById('btn-en').className = 'lang-btn'+(l==='en'?' active':'');
  const t = i18n[l];
  document.getElementById('t-badge').textContent = t.badge;
  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-subtitle').textContent = t.subtitle;
  document.getElementById('t-lnome').textContent = t.lnome;
  document.getElementById('t-lloc').textContent = t.lloc;
  document.getElementById('t-geo').textContent = t.geo;
  document.getElementById('btn-geo').title = t.geo;
  document.getElementById('nome').placeholder = t.pnome;
  document.getElementById('t-lcidade').textContent = t.lcidade;
  document.getElementById('cidade').placeholder = t.pcidade;
  document.getElementById('t-lestado').textContent = t.lestado;
  document.getElementById('estado').placeholder = t.pestado;
  document.getElementById('t-lpais').textContent = t.lpais;
  document.getElementById('t-btn').textContent = t.btn;
  document.getElementById('t-notice').textContent = t.notice;
  document.getElementById('pais').placeholder = t.ppais;
  document.getElementById('errMsg').className = 'err-msg';
}

function showErr(txt){
  const el = document.getElementById('errMsg');
  el.textContent = txt;
  el.className = 'err-msg visible';
}

function submeter(){
  const t = i18n[lang];
  const nome   = document.getElementById('nome').value.trim();
  const cidade = document.getElementById('cidade').value.trim();
  const estado = document.getElementById('estado').value.trim();
  const pais   = document.getElementById('pais').value;
  if(!nome)  { showErr(t.errNome);   return; }
  if(!cidade){ showErr(t.errCidade); return; }
  if(!pais)  { showErr(t.errPais);   return; }  // pais is free text
  document.getElementById('errMsg').className = 'err-msg';
  const subject = encodeURIComponent(t.subject(nome));
  const body    = encodeURIComponent(t.body(nome, cidade, estado||'—', pais));
  window.location.href = `mailto:${DEST}?subject=${subject}&body=${body}`;
  const local = [cidade, estado, pais].filter(Boolean).join(', ');
  document.getElementById('t-successMsg').textContent = t.successMsg(nome, local);
  document.getElementById('formCard').style.display = 'none';
  document.getElementById('successCard').style.display = 'block';
}

setLang(detectLang());

function detectarLocalizacao(){
  const t = i18n[lang];
  const btn = document.getElementById('btn-geo');
  const icon = document.getElementById('geo-icon');
  const geoText = document.getElementById('t-geo');
  btn.disabled = true;
  icon.textContent = '⏳';
  geoText.textContent = t.geoDetecting;

  if(!navigator.geolocation){
    showErr(t.geoErr);
    resetGeoBtn();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        const {latitude, longitude} = pos.coords;
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&accept-language=${lang}`);
        const data = await res.json();
        const addr = data.address || {};
        const cidade = addr.city || addr.town || addr.village || addr.municipality || '';
        const estado = addr.state || addr.region || '';
        const pais = addr.country || '';
        if(cidade) document.getElementById('cidade').value = cidade;
        if(estado) document.getElementById('estado').value = estado;
        if(pais)   document.getElementById('pais').value   = pais;
        icon.textContent = '✅';
        geoText.textContent = t.geo;
        btn.disabled = false;
      } catch(e){
        showErr(t.geoErr);
        resetGeoBtn();
      }
    },
    () => {
      showErr(t.geoErr);
      resetGeoBtn();
    },
    {timeout: 8000}
  );
}

function resetGeoBtn(){
  const t = i18n[lang];
  document.getElementById('geo-icon').textContent = '📍';
  document.getElementById('t-geo').textContent = t.geo;
  document.getElementById('btn-geo').disabled = false;
}
</script>
